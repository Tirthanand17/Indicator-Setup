name: Offline quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    # Standard public-repository runner only; never a larger/paid runner.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked application/test dependencies
        run: python -m pip install --require-hashes -r cloud-alerts/requirements-linux-test.hashed.lock
      - name: Install pinned QA tools
        run: python -m pip install -r cloud-alerts/requirements-quality.txt
      - name: Install locked JavaScript tooling
        working-directory: edge-cloudflare
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Offline lint, types, regressions and Python advisories
        run: node scripts/offline-quality.mjs --all
      - name: JavaScript dependency advisories
        working-directory: edge-cloudflare
        run: npm audit --audit-level=low
